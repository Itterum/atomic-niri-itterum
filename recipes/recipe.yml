---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: atomic-niri-itterum
description: Bazzite DX GNOME with Niri.

base-image: ghcr.io/ublue-os/bazzite-dx-nvidia-gnome
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - niri
        - helix

  - type: signing
