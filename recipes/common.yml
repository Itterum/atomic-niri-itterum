---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - avengemedia/danklinux
        - avengemedia/dms
        - scottames/ghostty
    install:
      packages:
        - niri
        - dms
        - quickshell-git
        - helix
        - zed
        - ghostty

  - type: dnf
    no-cache: true
    install:
      packages:
        - https://persistent.oaistatic.com/codex-app-prod/linux/rpm/latest/chatgpt.x86_64.rpm
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.brave.Browser
          - org.telegram.desktop
          - com.github.tchx84.Flatseal
          - org.keepassxc.KeePassXC
          - md.obsidian.Obsidian
          - org.localsend.localsend_app
          - org.gnome.Boxes

  - type: files
    files:
      - source: system
        destination: /

  - type: signing
