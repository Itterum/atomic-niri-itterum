---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: containerfile
    snippets:
      - |
        COPY --from=ghcr.io/ublue-os/brew:latest /system_files/ /tmp/brew_files/
      - |
        RUN cp -a /tmp/brew_files/. / && \
        rm -rf /tmp/brew_files && \
        systemctl enable brew-setup.service

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
        - https://dl.google.com/linux/chrome/rpm/stable/x86_64/google-chrome.repo
      copr:
        - avengemedia/danklinux
        - avengemedia/dms
        - scottames/ghostty
    install:
      packages:
        - google-chrome-stable
        - dms
        - quickshell-git
        - greetd
        - dms-greeter
        - gnome-keyring
        - gnome-keyring-pam
        - helix
        - zsh
        - zed
        - ghostty

  - type: dnf
    no-cache: true
    install:
      packages:
        - https://persistent.oaistatic.com/codex-app-prod/linux/rpm/latest/chatgpt.x86_64.rpm

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.brave.Browser
          - org.telegram.desktop
          - com.github.tchx84.Flatseal
          - org.keepassxc.KeePassXC
          - md.obsidian.Obsidian
          - org.localsend.localsend_app
          - org.gnome.Boxes

  - type: files
    files:
      - source: system
        destination: /

  - type: script
    scripts:
      - setup-greetd.sh

  - type: signing
