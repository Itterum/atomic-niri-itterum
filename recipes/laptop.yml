---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
version: 1
name: atomic-niri-itterum
description: Bazzite DX GNOME with Niri for laptop.

base-image: ghcr.io/ublue-os/bazzite-dx-gnome
image-version: stable

modules:
  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - avengemedia/danklinux
        - avengemedia/dms
        - scottames/ghostty
    install:
      packages:
        - niri
        - dms
        - quickshell-git
        - helix
        - zed
        - ghostty

  - type: dnf
    no-cache: true
    install:
      packages:
        - https://persistent.oaistatic.com/codex-app-prod/linux/rpm/latest/chatgpt.x86_64.rpm
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - com.brave.Browser
          - org.telegram.desktop
          - com.github.tchx84.Flatseal

  - type: files
    files:
      - source: system
        destination: /

  - type: signing
